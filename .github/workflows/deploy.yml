name: Deploy to GitHub Pages

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.18.0 

      - name: Install dependencies
        run: npm install

      - name: Build and Deploy
        run: |
          npm run build
          npm run deploy